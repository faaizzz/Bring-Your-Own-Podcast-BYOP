# HSTS only makes sense when the visitor came in over https (a proxy in front tells us).
map $http_x_forwarded_proto $byop_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security headers. The app is a single-page app served from this origin: scripts, styles,
    # fonts, images, audio and API calls all come from here; nothing may frame it. (Charts use
    # inline styles, hence 'unsafe-inline' for styles only.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security $byop_hsts always;

    root /usr/share/nginx/html;
    index index.html;

    # Requests are small JSON documents; only the uploads below (a cover, intro/outro/music
    # clips) may be bigger. The API enforces its own per-file limits as well.
    client_max_body_size 1m;

    # Re-resolve `api` through Docker's DNS so recreating the api container does not leave
    # nginx proxying to a stale address (a variable in proxy_pass forces runtime resolution).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api/shows/[^/]+/(cover|audio/[^/]+)$ {
        client_max_body_size 26m;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # The public podcast feed and episode audio, fetched by podcast apps. Audio is streamed
    # straight through (and `Range` requests are passed on) rather than buffered on disk.
    location ~ ^/(feeds|media)/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Live run view (Server-Sent Events): pass each event on as it arrives instead of
    # buffering the response, and allow the long-lived connection.
    location ~ ^/api/runs/[^/]+/stream$ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
