server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Episode audio uploads and large responses go through the API.
    client_max_body_size 25m;

    # Re-resolve `api` through Docker's DNS so recreating the api container does not leave
    # nginx proxying to a stale address (a variable in proxy_pass forces runtime resolution).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
