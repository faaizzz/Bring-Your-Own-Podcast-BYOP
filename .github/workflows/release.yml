name: Release

# Pushing a tag like v0.1.0 builds multi-arch images, publishes them to GHCR and creates the GitHub
# release from CHANGELOG.md. Run it by hand ("Run workflow") to test the build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the images (otherwise only build them)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: web
            dockerfile: docker/web.Dockerfile
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.push }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/byop-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  release:
    name: GitHub release
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release-notes.sh "${TAG#v}" > release-notes.md
          gh release create "$TAG" --title "BYOP $TAG" --notes-file release-notes.md $(case "$TAG" in *-*) echo --prerelease;; esac)
