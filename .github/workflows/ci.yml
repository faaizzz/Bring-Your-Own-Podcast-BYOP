name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: byop
          POSTGRES_PASSWORD: byop
          POSTGRES_DB: byop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U byop -d byop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Match the service containers above (the defaults in tests/conftest.py).
      TEST_DATABASE_URL: postgresql+asyncpg://byop:byop@localhost:5432/byop_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (audio conversion tests)
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    name: web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs a recent Node; matches docker/web.Dockerfile.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: compose (repo checks, image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-repo.sh
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - name: Build images
        run: docker compose -f docker-compose.yml build
        env:
          BUILDKIT_PROGRESS: plain

  e2e:
    name: e2e (Playwright, mock model and voices)
    # A full run of the product from a clean clone, with stand-ins for the model, voice and news
    # servers (docker-compose.e2e.yml), so no keys are needed. See docs/e2e.md.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILES: -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the stack
        run: docker compose $COMPOSE_FILES up -d --build --wait
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Typecheck the test
        working-directory: tests/e2e
        run: npm run typecheck
      - name: Run the test
        working-directory: tests/e2e
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Collect container logs
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color > e2e-container-logs.txt
      - name: Upload screenshots, traces and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            e2e-container-logs.txt
          retention-days: 14
