# Approximate list prices in USD. They are used only when a provider does not say what a call
# cost (OpenRouter does; OpenAI and local models do not). Prices change: check your provider's
# page, and override any entry under Settings > Pricing.
#
# llm: USD per 1M tokens, keyed by model id. The longest id that matches the start of the model
#      name wins ("gpt-4.1-mini" also covers "gpt-4.1-mini-2025-04-14").
# tts: USD per 1M characters, keyed by provider; `models` gives a price for one model name.
llm:
  gpt-4.1: { input: 2.00, output: 8.00 }
  gpt-4.1-mini: { input: 0.40, output: 1.60 }
  gpt-4.1-nano: { input: 0.10, output: 0.40 }
  gpt-4o: { input: 2.50, output: 10.00 }
  gpt-4o-mini: { input: 0.15, output: 0.60 }
  o4-mini: { input: 1.10, output: 4.40 }
  anthropic/claude-haiku-5.5: { input: 0.10, output: 0.50 }
  deepseek/deepseek-v4.1-flash: { input: 0.04, output: 0.144 }
tts:
  openai:
    per_million_chars: 15.00
    models:
      tts-1: 15.00
      tts-1-hd: 30.00
      gpt-4o-mini-tts: 12.00
  elevenlabs:
    per_million_chars: 180.00
  kokoro:
    per_million_chars: 0.00 # runs on your own machine
