[project]
name = "byop"
version = "0.1.0"
description = "BYOP - Bring Your Own Podcast API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "celery[redis]>=5.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "httpx>=0.27",
  "redis>=5.2",
  "bcrypt>=4.2",
  "pyjwt>=2.9",
  "cryptography>=43",
  "openai>=1.50",
  "tenacity>=9",
  "boto3>=1.35",
  "pillow>=11",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.35",
  "celery-types>=0.22",
  "httpx2>=2.13.1",
  "moto[s3,server]>=5",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "testcontainers>=4.8",
  "types-pillow>=10.2.0.20240822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["byop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated; keep their column lists on one line.
"alembic/versions/*" = ["E501"]

[tool.mypy]
strict = true
files = ["byop", "tests", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[[tool.mypy.overrides]]
module = ["kombu.*"]
ignore_missing_imports = true
