# Development overrides, applied automatically by `docker compose` (and `make up`).
# For a production-like run use: docker compose -f docker-compose.yml up -d
x-dev-source: &dev-source
  volumes:
    - ./apps/api:/app
    - media:/data/media

services:
  # Published on loopback only, so `make test` can reach them from the host.
  postgres:
    ports:
      - "127.0.0.1:${BYOP_POSTGRES_PORT:-5432}:5432"
  redis:
    ports:
      - "127.0.0.1:${BYOP_REDIS_PORT:-6379}:6379"
  api:
    <<: *dev-source
    command: ["uvicorn", "byop.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  worker:
    <<: *dev-source
  beat:
    <<: *dev-source
